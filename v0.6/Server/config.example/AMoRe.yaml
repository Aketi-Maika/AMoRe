# AMoRe.yaml - AMoRe v0.6 Server設定（本体）
#
# このフォルダは設定例。Serverでは次のようにコピーして使う（config/ はGit管理外）。
#   cp config.example/*.yaml config/
#
# 設定はセクションごとにファイルを分けている。下の include に書いたファイルを読み込み、
# 1つの設定としてまとめる（同じセクションを2つのファイルに書くとエラー）。
# 使わない機能のファイルは include から外してもよい（既定値で動く）。
# 1つの AMoRe.yaml に全部書いても読める（v0.3 までの形式）。
#
# - cameras.yaml は管理Web（https://<Server>/admin/）の操作と Server 間の同期で自動的に書き換わる。
# - それ以外の項目を手動で変更した場合は、次で検証してから再起動して反映する。
#     docker compose run --rm --no-deps amore check
#     docker compose up -d --force-recreate
# 「暫定」と記載した値は要件定義書 v2 の暫定値。試作・評価後に確定する。

version: 1

include:
  - cameras.yaml      # cameras（AMoRe が書き換える）
  - recording.yaml    # recording（録画）
  - secrets.yaml      # secrets（1Password Connect）
  - access.yaml       # access（画面ごとの入室パスワード）
  - cluster.yaml      # cluster（拠点ごとの Server による冗長化・共通IP）
  - monitoring.yaml   # monitoring（Prometheus・Loki・Zabbix・Grafana）
  - ai.yaml           # ai（AI API 連携）
  - kubernetes.yaml   # kubernetes（media.runtime: kubernetes の場合）

server:
  # コンテナ内の待受。ホスト側は compose.yaml で 443/tcp に公開する。
  listen: "0.0.0.0:8443"
  # この Server VM の実IP（ポート・スキームなし）。
  # 冗長構成（cluster.yaml）では Server ごとに異なり、cluster.peers のこの Server の url と同じにする。
  # 冗長構成を使わない場合は、カメラPC・編集PCの接続先（WebRTCのICE候補・OBS用SRT URL）にもなる。
  # media.runtime: kubernetes では、この拠点の接続先IP（MetalLB が割り当てる。ノードの IP とは別）。
  public_host: "10.40.0.20"
  tls:
    cert: /certs/server.crt
    key: /certs/server.key
  camera_dir: /srv/camera
  obs_dir: /srv/obs
  admin_dir: /srv/admin

# カメラ1台につき1つのメディア処理コンテナ（MediaMTX＋FFmpeg）を自動で作成する。
media:
  # カメラのコンテナを動かす仕組み: docker（Docker Compose）| kubernetes（Container/ の手順）
  runtime: docker
  image: bluenviron/mediamtx:1.21.1-ffmpeg
  container_prefix: amore-cam-
  # 構築時に docker network create で作成するネットワーク（docker の場合）。
  docker_network: amore_net
  # MediaMTX が AMoRe からの接続を許可する範囲。docker: amore_net のサブネット / kubernetes: Pod の CIDR（k3s 既定 10.42.0.0/16）
  docker_subnet: "172.30.40.0/24"
  shared_volume: amore-shared
  shared_dir: /shared
  # カメラごとに範囲内の空きポートを小さい順に割り当てる。firewalldでも同じ範囲を開ける。
  # 冗長構成では全 Server で同じ範囲にする（カメラ一覧・ポートを全 Server で共有するため）。
  webrtc_udp_ports:
    first: 8189
    last: 8192
  srt_ports:
    first: 8890
    last: 8893
  # VP8で受信した映像をH.264へ変換する場合のみ使用（CPU負荷が高い）。
  x264_preset: ultrafast
  # カメラコンテナのUDP受信バッファ（バイト）。0 は OS 既定。ホストの net.core.rmem_max も
  # 同じ値以上にすること（Server手順書「sysctl」）。不足するとキーフレームが欠けて映像が乱れる。
  udp_read_buffer_bytes: 8388608

limits:
  # 開発段階1は最大4台。
  max_cameras: 4

video:
  # 標準映像品質（暫定）。ブラウザ送信の上限ビットレートは target_bitrate_kbps を使い、
  # max_bitrate_kbps は手動設定・Server側変換時の上限として使う。
  standard:
    width: 1920
    height: 1080
    fps: 30
    target_bitrate_kbps: 6000
    max_bitrate_kbps: 8000
  # 帯域不足時の品質（暫定）。
  fallback:
    width: 1280
    height: 720
    fps: 30
    target_bitrate_kbps: 3000
    max_bitrate_kbps: 4000
  # H.264を優先し、使えない環境はVP8で送信してServerでH.264へ変換する。
  codec_preference: [H264, VP8]

audio:
  # 送信画面の「音声を送信」の初期値。
  enabled: true
  # Server→OBS は AAC-LC（暫定: 48kHz・最大2ch・128kbps）。
  sample_rate: 48000
  max_channels: 2
  bitrate_kbps: 128

srt:
  # OBS(Caller)のSRT遅延。LAN 120 / WAN 200（暫定）。OBS側URLのlatencyへ反映される。
  # Server 間の中継（拠点間VPN経由の取り込み）にも同じ値を使う。
  latency_ms: 120

quality_control:
  enabled: true
  stats_interval_ms: 1000
  # 推定帯域 4.5Mbps未満が5秒継続で720pへ（暫定）。
  downgrade_below_kbps: 4500
  downgrade_after_sec: 5
  # 推定帯域 8Mbps以上が15秒継続で1080pへ復帰（暫定）。
  upgrade_above_kbps: 8000
  upgrade_after_sec: 15
  # 復帰後15秒以内に再低下したら、その後30秒は復帰を保留（暫定）。
  relapse_window_sec: 15
  hold_after_relapse_sec: 30

reconnect:
  # 1秒、2秒、4秒、以降4秒（暫定）。Server の切替時も同じ間隔で共通IPへ張り直す。
  backoff_sec: [1, 2, 4]

# NAT越えが必要な場合のみ指定する。LAN内（VLAN間ルーティング・拠点間VPN）では不要。
# 例:
#   - urls: ["stun:stun.example.jp:3478"]
#   - urls: ["turn:turn.example.jp:3478"]
#     username: amore
#     credential: "op://AMoRe/TURN/credential"
ice_servers: []
